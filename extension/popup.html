<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manga & Manhwa Image Translator</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #27272a;
    }
    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #f97316, #ea580c);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
    }
    .logo svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
    }
    .title {
      font-weight: 700;
      font-size: 14px;
      line-height: 1.2;
    }
    .sub {
      font-size: 11px;
      color: #a1a1aa;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .label {
      font-size: 12px;
      color: #d4d4d8;
    }
    select, input[type="text"], input[type="password"] {
      width: 100%;
      background: #18181b;
      border: 1px solid #27272a;
      color: #f4f4f5;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.15s;
    }
    select:focus, input:focus {
      border-color: #f97316;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #27272a;
      transition: .2s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #f97316;
    }
    input:checked + .slider:before {
      transform: translateX(16px);
    }
    .btn-save {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      background: #f97316;
      color: #ffffff;
      font-weight: 700;
      padding: 9px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      margin-top: 14px;
      font-size: 12px;
      transition: background 0.15s ease;
    }
    .btn-save:hover {
      background: #ea580c;
    }
    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      background: #18181b;
      border: 1px solid #27272a;
      color: #d4d4d8;
      font-weight: 600;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
      font-size: 12px;
      text-decoration: none;
      box-sizing: border-box;
      transition: all 0.15s ease;
    }
    .btn-secondary:hover {
      background: #27272a;
      color: #ffffff;
    }
    .links-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
      font-size: 11px;
    }
    .links-row a {
      color: #a1a1aa;
      text-decoration: none;
    }
    .links-row a:hover {
      color: #f97316;
      text-decoration: underline;
    }
    .footer {
      font-size: 10px;
      color: #71717a;
      text-align: center;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24">
        <path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/>
      </svg>
    </div>
    <div>
      <div class="title">Manga & Manhwa Image Translator</div>
      <div class="sub">AI Vision Extension v1.0</div>
    </div>
  </div>

  <div class="row">
    <span class="label">Auto-Translate on Scroll</span>
    <label class="switch">
      <input type="checkbox" id="auto-translate-toggle">
      <span class="slider"></span>
    </label>
  </div>

  <div style="margin-bottom: 12px;">
    <div class="label" style="margin-bottom: 6px;">Target Language</div>
    <select id="target-lang">
      <option value="en">English</option>
      <option value="es">Spanish (Español)</option>
      <option value="fr">French (Français)</option>
      <option value="de">German (Deutsch)</option>
      <option value="pt">Portuguese (Português)</option>
      <option value="it">Italian (Italiano)</option>
      <option value="ru">Russian (Русский)</option>
      <option value="zh">Chinese (中文)</option>
      <option value="ja">Japanese (日本語)</option>
      <option value="ko">Korean (한국어)</option>
      <option value="id">Indonesian (Bahasa)</option>
    </select>
  </div>

  <div style="margin-bottom: 12px;">
    <div class="label" style="margin-bottom: 6px;">Gemini Vision Model</div>
    <select id="gemini-model">
      <option value="gemini-3.8-flash" selected>Gemini 3.8 Flash (Latest & Recommended by Google)</option>
      <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite (Ultra Fast)</option>
      <option value="gemini-3.1-flash">Gemini 3.1 Flash (Next-Gen Multimodal)</option>
      <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
      <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite</option>
      <option value="gemini-2.0-flash">Gemini 2.0 Flash (Stable)</option>
      <option value="auto">Auto-Select Fastest Available</option>
      <option value="gemini-1.5-flash">Gemini 1.5 Flash (Classic)</option>
    </select>
  </div>

  <div style="margin-bottom: 12px;">
    <div class="label" style="margin-bottom: 6px;">Google Gemini API Key (BYOK)</div>
    <input type="password" id="gemini-key" placeholder="AIzaSy... (100% Free & Private)">
  </div>

  <button id="save-btn" class="btn-save">Save Settings</button>

  <a href="https://manga-manhwa-translator.vercel.app" target="_blank" class="btn-secondary">
    Open Web Studio
  </a>

  <div class="links-row">
    <a href="https://manga-manhwa-translator.vercel.app/updates" target="_blank">What's New</a>
    <span>•</span>
    <a href="https://manga-manhwa-translator.vercel.app/feedback" target="_blank">Feedback</a>
    <span>•</span>
    <a href="https://manga-manhwa-translator.vercel.app/privacy" target="_blank">Privacy</a>
  </div>

  <div class="footer">
    Hover any manga/webtoon image & click Translate.
  </div>

  <script src="popup.js"></script>
</body>
</html>
