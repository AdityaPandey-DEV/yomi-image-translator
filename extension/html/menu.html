<!-- Yomi context menu.
     Injected into the shadow root on first use by ensureYomiMenu() in content.js and kept
     there afterwards, the same as download.html and details.html. Opened from the keyboard
     shortcut or the page context menu, and positioned by the script at the pointer.

     Every item keeps the id the wiring looks for; the dividers that used to be six separate
     elements are now divide-y on the list, which is how the rest of the UI draws them. -->
<div id="yomi-menu"
  class="!hidden flex flex-col fixed top-0 left-0 w-72 max-w-[calc(100vw-1rem)] bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-xl shadow-2xl overflow-hidden z-[2147483647]">
  <!-- Header. Clicking it closes the menu, which is existing behaviour - the button is just the
       part that says so. -->
  <div id="yomi-menu-header"
    class="flex items-center gap-2 px-4 py-3 border-b border-neutral-200 dark:border-neutral-800 bg-neutral-50 dark:bg-neutral-900/50 cursor-pointer">
    <img id="yomi-menu-icon" class="w-5 h-5 shrink-0" alt="" aria-hidden="true">
    <h3 class="flex-1 min-w-0 text-base font-semibold text-neutral-800 dark:text-neutral-100">Yomi Menu</h3>
    <button id="yomi-menu-close" type="button" aria-label="Close"
      class="text-neutral-400 hover:text-neutral-700 dark:hover:text-neutral-300 cursor-pointer focus:outline-none">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
        aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>

  <div class="flex flex-col py-1 divide-y divide-neutral-200 dark:divide-neutral-800">
      <button id="yomi-menu-screenshot" type="button"
        class="w-full flex items-center gap-3 px-4 py-2.5 text-left text-sm text-neutral-700 dark:text-neutral-200 hover:bg-neutral-100 dark:hover:bg-neutral-800 hover:text-neutral-900 dark:hover:text-white cursor-pointer duration-100 ease-in-out focus:outline-none">
        <span class="flex-1 min-w-0 truncate">Screenshot Image</span>
        <span class="shrink-0 text-xs tabular-nums text-neutral-400 dark:text-neutral-500">Alt+Shift+C</span>
      </button>
      <button id="yomi-menu-translate" type="button"
        class="w-full flex items-center gap-3 px-4 py-2.5 text-left text-sm text-neutral-700 dark:text-neutral-200 hover:bg-neutral-100 dark:hover:bg-neutral-800 hover:text-neutral-900 dark:hover:text-white cursor-pointer duration-100 ease-in-out focus:outline-none">
        <span class="flex-1 min-w-0 truncate">Translate Image</span>
        <span class="shrink-0 text-xs tabular-nums text-neutral-400 dark:text-neutral-500">Alt+Shift+Z</span>
      </button>
      <button id="yomi-menu-screencrop" type="button"
        class="w-full flex items-center gap-3 px-4 py-2.5 text-left text-sm text-neutral-700 dark:text-neutral-200 hover:bg-neutral-100 dark:hover:bg-neutral-800 hover:text-neutral-900 dark:hover:text-white cursor-pointer duration-100 ease-in-out focus:outline-none">
        <span class="flex-1 min-w-0 truncate">Screen Crop</span>
        <span class="shrink-0 text-xs tabular-nums text-neutral-400 dark:text-neutral-500">Alt+Shift+X</span>
      </button>
      <button id="yomi-menu-screencrop-repeat" type="button"
        class="w-full flex items-center gap-3 px-4 py-2.5 text-left text-sm text-neutral-700 dark:text-neutral-200 hover:bg-neutral-100 dark:hover:bg-neutral-800 hover:text-neutral-900 dark:hover:text-white cursor-pointer duration-100 ease-in-out focus:outline-none">
        <span class="flex-1 min-w-0 truncate">Repeat Last Screen Crop</span>
      </button>
      <button id="yomi-menu-edit" type="button"
        class="w-full flex items-center gap-3 px-4 py-2.5 text-left text-sm text-neutral-700 dark:text-neutral-200 hover:bg-neutral-100 dark:hover:bg-neutral-800 hover:text-neutral-900 dark:hover:text-white cursor-pointer duration-100 ease-in-out focus:outline-none">
        <span class="flex-1 min-w-0 truncate">Edit Image</span>
      </button>
      <button id="yomi-menu-auto" type="button"
        class="w-full flex items-center gap-3 px-4 py-2.5 text-left text-sm text-neutral-700 dark:text-neutral-200 hover:bg-neutral-100 dark:hover:bg-neutral-800 hover:text-neutral-900 dark:hover:text-white cursor-pointer duration-100 ease-in-out focus:outline-none">
        <span id="yomi-menu-auto-label" class="flex-1 min-w-0 truncate">Turn On Auto Translate</span>
      </button>
      <button id="yomi-menu-download" type="button"
        class="w-full flex items-center gap-3 px-4 py-2.5 text-left text-sm text-neutral-700 dark:text-neutral-200 hover:bg-neutral-100 dark:hover:bg-neutral-800 hover:text-neutral-900 dark:hover:text-white cursor-pointer duration-100 ease-in-out focus:outline-none">
        <span class="flex-1 min-w-0 truncate">Download Image</span>
      </button>
  </div>
</div>
